<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bellacino's QR Table Card</title>

<style>

body{
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#f2f2f2;
font-family:Arial, Helvetica, sans-serif;
}

.card{
width:5in;
height:7in;
background:white;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
text-align:center;
padding:30px 25px;
box-sizing:border-box;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.logo{
width:260px;
margin:0 auto 10px auto;
}

h1{
color:#c5121b;
font-size:32px;
margin:10px 0 5px 0;
}

.subtitle{
font-size:18px;
color:#444;
margin-bottom:10px;
}

.qr{
width:260px;
margin:10px auto;
}

.scan{
font-size:20px;
font-weight:bold;
margin-top:10px;
}

.footer{
font-size:16px;
color:#555;
line-height:1.4;
margin-top:10px;
}

</style>
</head>

<body>

<div class="card">

<div>
<img src="bella_logo.png" class="logo">
<h1>Enjoying Your Bellacino's?</h1>
<div class="subtitle">Scan to view our menu or leave feedback</div>
</div>

<div>
<img src="BellacinosMain.png" class="qr">
<div class="scan">📱 Scan Here</div>
</div>

<div class="footer">
Your feedback helps us improve and serve you better.<br>
Thank you for supporting Bellacino's Pizza & Grinders!
</div>

</div>

</body>
</html>
